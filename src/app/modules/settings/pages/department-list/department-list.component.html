<div class="dept-list-container">
  <div class="header">
    <h2>Departments</h2>
    <button class="btn-primary" (click)="openCreateModal()">+ New Department</button>
  </div>

  <div class="filters">
    <input type="text"
           placeholder="Search departments..."
           [(ngModel)]="searchTerm"
           (input)="onSearch()"
           class="search-input">
    <label class="checkbox-label">
      <input type="checkbox" [(ngModel)]="showInactive" (change)="toggleInactive()">
      Show inactive
    </label>
  </div>

  <div class="table-wrapper" *ngIf="!loading; else loadingSpinner">
    <table class="dept-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Description</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let dept of filteredDepartments | paginate: {
                      itemsPerPage: pageSize,
                      currentPage: currentPage,
                      totalItems: totalItems
                    }">
          <td>{{ dept.departmentId }}</td>
          <td><strong>{{ dept.departmentName }}</strong></td>
          <td>{{ dept.description || '—' }}</td>
          <td>
            <span class="status-badge" [class.inactive]="!dept.isActive">
              {{ dept.isActive ? 'Active' : 'Inactive' }}
            </span>
          </td>
          <td class="actions">
            <button class="btn-icon" (click)="openEditModal(dept)" title="Edit">✏️</button>
             <button class="btn-icon" (click)="openPermissionsModal(dept)" title="Manage Permissions">🔐</button>
          </td>
        </tr>
        <tr *ngIf="filteredDepartments.length === 0">
          <td colspan="5" class="empty">No departments found</td>
        </tr>
      </tbody>
    </table>

    <div class="pagination" *ngIf="totalItems > 0">
      <pagination-controls
        previousLabel="‹ Prev"
        nextLabel="Next ›"
        [responsive]="true"
        (pageChange)="goToPage($event)">
      </pagination-controls>
    </div>
  </div>

  <ng-template #loadingSpinner>
    <div class="spinner"></div>
  </ng-template>
</div>

<app-department-form
  *ngIf="showModal"
  [department]="editingDepartment"
  (close)="onModalClose($event)">
</app-department-form>
  <!-- <pre>{{selectedDepartment|json}}</pre> -->
@if(showPermissionModal==true){

<app-department-permission-modal

  [department]="selectedDepartment"
  (close)="onPermissionModalClose($event)">
</app-department-permission-modal>
}
