<!-- department-form.component.html -->
<div class="modal-overlay" (click)="close.emit(false)">
  <div class="modal-container" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>{{ isEdit ? 'Edit Department' : 'New Department' }}</h3>
      <button class="close-btn" (click)="close.emit(false)">×</button>
    </div>
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Department Name *</label>
        <input type="text" formControlName="departmentName" class="form-control">
        <div class="error" *ngIf="form.get('departmentName')?.invalid && form.get('departmentName')?.touched">
          Name is required
        </div>
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea formControlName="description" rows="3" class="form-control"></textarea>
      </div>

      <div class="form-group">
        <label> Department Head</label>
        <select formControlName="managerId" class="form-control">
          <option [value]="null">— None —</option>
          <option *ngFor="let staff of managingStaff" [value]="staff.userId">
            {{ staff.firstName }} {{ staff.lastName }} ({{ staff.roleName }})
          </option>
        </select>
      </div>

      <div class="form-row">
        <!-- <div class="form-group">
          <label>Sort Order</label>
          <input type="number" formControlName="sortOrder" class="form-control">
        </div> -->
        <div class="form-group">
          <label class="checkbox-label">
            <input type="checkbox" formControlName="isActive">
            Active
          </label>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn-secondary" (click)="close.emit(false)">Cancel</button>
        <button type="submit" class="btn-primary" [disabled]="form.invalid || loading">
          {{ loading ? 'Saving...' : 'Save' }}
        </button>
      </div>
    </form>
  </div>
</div>
