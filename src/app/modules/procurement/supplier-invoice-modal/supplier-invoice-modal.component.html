<div class="modal-overlay" (click)="cancel()">
  <div class="modal-container" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>New Supplier Invoice</h3>
      <button class="close-btn" (click)="cancel()">×</button>
    </div>
    <form [formGroup]="invoiceForm" (ngSubmit)="submit()">
      <div class="form-row">
        <div class="form-group">
          <label>PO Number *</label>
          <input type="text" formControlName="poNumber" class="form-control">
            <div *ngIf="poNotFound" class="error">PO Number not found</div>
          <div *ngIf="supplierName" class="info">Supplier: {{ supplierName }}</div>
        </div>
        <div class="form-group">
          <label>Invoice Number *</label>
          <input type="text" formControlName="invoiceNumber" class="form-control">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Invoice Date *</label>
          <input type="date" formControlName="invoiceDate" class="form-control">
        </div>
        <div class="form-group">
          <label>Due Date *</label>
          <input type="date" formControlName="dueDate" class="form-control">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Sub Total *</label>
          <input type="number" formControlName="subTotal" class="form-control" step="0.01">
        </div>
        <div class="form-group">
          <label>Tax Amount *</label>
          <input type="number" formControlName="taxAmount" class="form-control" step="0.01">
        </div>
      </div>
      <div class="form-group">
        <label>Total Amount</label>
        <input type="text" formControlName="totalAmount" class="form-control" readonly>
      </div>
      <div class="form-group">
        <label>Notes</label>
        <textarea formControlName="notes" rows="2" class="form-control"></textarea>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-secondary" (click)="cancel()">Cancel</button>
        <button type="submit" class="btn-primary" [disabled]="invoiceForm.invalid || submitting">Save Invoice</button>
      </div>
    </form>
  </div>
</div>
