  <div class="register-container">
      <div class="register-card">
        <h2>Create Guest Account</h2>
        <form [formGroup]="registerForm" (ngSubmit)="register()">
          <div class="form-row">
            <div class="form-group">
              <label>First Name *</label>
              <input type="text" formControlName="firstName" class="form-control">
              <div class="error" *ngIf="registerForm.get('firstName')?.invalid && registerForm.get('firstName')?.touched">
                First name required
              </div>
            </div>
            <div class="form-group">
              <label>Last Name *</label>
              <input type="text" formControlName="lastName" class="form-control">
              <div class="error" *ngIf="registerForm.get('lastName')?.invalid && registerForm.get('lastName')?.touched">
                Last name required
              </div>
            </div>
          </div>

          <div class="form-group">
            <label>Email *</label>
            <input type="email" formControlName="email" class="form-control">
            <div class="error" *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">
              Valid email required
            </div>
          </div>

          <div class="form-group">
            <label>Phone Number *</label>
            <input type="tel" formControlName="phoneNumber" class="form-control" placeholder="e.g., +1234567890">
            <div class="error" *ngIf="registerForm.get('phoneNumber')?.invalid && registerForm.get('phoneNumber')?.touched">
              Valid phone number required
            </div>
          </div>

          <div class="form-group">
            <label>Password *</label>
            <input type="password" formControlName="password" class="form-control">
            <div class="error" *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched">
              Password must be at least 6 characters
            </div>
          </div>

          <div class="form-group">
            <label>Confirm Password *</label>
            <input type="password" formControlName="confirmPassword" class="form-control">
            <div class="error" *ngIf="registerForm.hasError('mismatch') && registerForm.get('confirmPassword')?.touched">
              Passwords do not match
            </div>
          </div>

          <button type="submit" class="btn-primary" [disabled]="registerForm.invalid || isSubmitting">
            {{ isSubmitting ? 'Creating Account...' : 'Register' }}
          </button>
        </form>
        <p class="login-link">Already have an account? <a (click)="goToLogin()">Login here</a></p>
      </div>
    </div>
