 <div class="modal-overlay" (click)="close()">
      <div class="modal-container" (click)="$event.stopPropagation()">
        <div class="modal-header">
          <h3>Login to Continue</h3>
          <button class="close-btn" (click)="close()">×</button>
        </div>
        <div class="modal-body">
          <form [formGroup]="loginForm" (ngSubmit)="login()">
            <div class="form-group">
              <label>Email</label>
              <input type="email" formControlName="email" class="form-control" placeholder="your@email.com">
            </div>
            <div class="form-group">
              <label>Password</label>
              <input type="password" formControlName="password" class="form-control" placeholder="••••••">
            </div>
            <div class="form-actions">
              <button type="submit" class="btn-primary" [disabled]="loginForm.invalid || isLoading">
                {{ isLoading ? 'Logging in...' : 'Login' }}
              </button>
            </div>
          </form>
          <div class="register-link">
            Don't have an account? <a (click)="close(); showRegister.emit()">Register now</a>
          </div>
        </div>
      </div>
    </div>
