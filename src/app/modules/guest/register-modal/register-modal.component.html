<div class="modal-overlay" (click)="close()">
  <div class="modal-container" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>Create an Account</h3>
      <button class="close-btn" (click)="close()">×</button>
    </div>
    <div class="modal-body">
      <form [formGroup]="registerForm" (ngSubmit)="register()">
        <div class="form-row">
          <div class="form-group">
            <label>First Name *</label>
            <input type="text" formControlName="firstName" class="form-control">
          </div>
          <div class="form-group">
            <label>Last Name *</label>
            <input type="text" formControlName="lastName" class="form-control">
          </div>
        </div>
        <div class="form-group">
          <label>Email *</label>
          <input type="email" formControlName="email" class="form-control">
        </div>
        <div class="form-group">
          <label>Phone Number *</label>
          <input type="tel" formControlName="phoneNumber" class="form-control">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Password *</label>
            <input type="password" formControlName="password" class="form-control">
          </div>
          <div class="form-group">
            <label>Confirm Password *</label>
            <input type="password" formControlName="confirmPassword" class="form-control">
          </div>
        </div>
        <div class="error" *ngIf="registerForm.hasError('mismatch') && registerForm.get('confirmPassword')?.touched">
          Passwords do not match
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary" [disabled]="registerForm.invalid || isLoading">
            {{ isLoading ? 'Creating account...' : 'Register' }}
          </button>
        </div>
      </form>
      <div class="login-link">
        Already have an account? <a (click)="close(); showLoginModal.emit()">Login</a>
      </div>
    </div>
  </div>
</div>
