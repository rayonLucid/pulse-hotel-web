<div class="change-password-container">
  <h1>Change Password</h1>

  <div class="password-card">
    <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Current Password *</label>
        <input type="password" formControlName="currentPassword" class="form-control">
        <div class="error" *ngIf="passwordForm.get('currentPassword')?.invalid && passwordForm.get('currentPassword')?.touched">
          Current password is required
        </div>
      </div>

      <div class="form-group">
        <label>New Password *</label>
        <input type="password" formControlName="newPassword" class="form-control">
        <div class="error" *ngIf="passwordForm.get('newPassword')?.invalid && passwordForm.get('newPassword')?.touched">
          Password must be at least 6 characters
        </div>
      </div>

      <div class="form-group">
        <label>Confirm New Password *</label>
        <input type="password" formControlName="confirmPassword" class="form-control">
        <div class="error" *ngIf="passwordForm.hasError('mismatch') && passwordForm.get('confirmPassword')?.touched">
          Passwords do not match
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-secondary" (click)="cancel()">Cancel</button>
        <button type="submit" class="btn-primary" [disabled]="isSubmitting || passwordForm.invalid">
          {{ isSubmitting ? 'Changing...' : 'Change Password' }}
        </button>
      </div>
    </form>
  </div>
</div>
