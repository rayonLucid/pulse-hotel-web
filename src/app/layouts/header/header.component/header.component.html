<!-- src/app/layouts/header/header.component.html -->
<header class="app-header">
  <div class="header-left">
    <button class="mobile-menu-btn" (click)="toggleMobileMenu()">
      <i class="fas fa-bars"></i>
    </button>
    <div class="page-title">
      <h1>{{ router.url | titlecase }}</h1>
    </div>
  </div>

  <div class="header-right">
    <!-- Search -->
    <div class="search-bar">
      <i class="fas fa-search"></i>
      <input type="text" placeholder="Search...">
    </div>

    <!-- Notifications -->
    <div class="notifications">
      <i class="fas fa-bell"></i>
      <span class="badge">3</span>
    </div>

    <!-- User Menu -->
    <div class="user-menu" (click)="toggleUserMenu()">
      <div class="user-avatar">
        <span>{{ getUserInitials() }}</span>
      </div>
      <span class="user-name">{{ authService.getUserFullName() || 'Guest' }}</span>
      <i class="fas fa-chevron-down"></i>

      <!-- Dropdown Menu -->
      @if (showUserMenu) {
        <div class="dropdown-menu">
          <a routerLink="/settings/profile">
            <i class="fas fa-user"></i>
            <span>My Profile</span>
          </a>
          <a routerLink="/settings/security">
            <i class="fas fa-shield-alt"></i>
            <span>Security</span>
          </a>
          <a routerLink="/settings/preferences">
            <i class="fas fa-sliders-h"></i>
            <span>Preferences</span>
          </a>
          <div class="divider"></div>
          <a (click)="logout()" class="logout-item">
            <i class="fas fa-sign-out-alt"></i>
            <span>Logout</span>
          </a>
        </div>
      }
    </div>
  </div>
</header>

<!-- Mobile Menu Overlay -->
@if (showMobileMenu) {
  <div class="mobile-overlay" (click)="toggleMobileMenu()"></div>
}
