<!-- src/app/layouts/main-layout/main-layout.component.html -->
<div class="app-container">
  <!-- Sidebar Component -->
  <app-sidebar
    (sidebarToggled)="onSidebarToggle($event)"
    [class.mobile-open]="isMobileMenuOpen"
  ></app-sidebar>

  <!-- Mobile Menu Overlay -->
  @if (isMobileMenuOpen && isMobile) {
    <div class="mobile-overlay" (click)="closeMobileMenu()"></div>
  }

  <!-- Main Content Area -->
  <div
    class="main-content"
    [class.sidebar-collapsed]="isSidebarCollapsed && !isMobile"
    [class.sidebar-expanded]="!isSidebarCollapsed && !isMobile"
    [class.sidebar-open]="isMobileMenuOpen && isMobile"
  >
    <!-- Header -->
    <app-header [isMobile]="isMobile" (menuToggle)="toggleMobileMenu()"></app-header>

    <!-- Content Wrapper -->
    <div class="content-wrapper">
      <!-- Breadcrumb (Optional) -->
      <div class="breadcrumb-container" style="display: none;">
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb">
            <li class="breadcrumb-item">
              <a routerLink="/dashboard">Home</a>
            </li>
            @for (crumb of breadcrumbs; track crumb.path) {
              <li class="breadcrumb-item" [class.active]="$last">
                <a [routerLink]="crumb.path">{{ crumb.label }}</a>
              </li>
            }
          </ol>
        </nav>
      </div>

      <!-- Page Content -->
      <div class="page-content">
        <router-outlet></router-outlet>
      </div>
    </div>

    <!-- Footer -->
    <app-footer></app-footer>
  </div>

  <!-- Mobile Bottom Navigation -->
  @if (isMobile) {
    <div class="mobile-bottom-nav">
      <a
        routerLink="/dashboard"
        routerLinkActive="active"
        class="nav-item"
        (click)="closeMobileMenu()"
      >
        <i class="fas fa-chart-line"></i>
        <span>Dashboard</span>
      </a>
      <a
        routerLink="/bookings"
        routerLinkActive="active"
        class="nav-item"
        (click)="closeMobileMenu()"
      >
        <i class="fas fa-calendar-check"></i>
        <span>Bookings</span>
      </a>
      <a
        routerLink="/rooms"
        routerLinkActive="active"
        class="nav-item"
        (click)="closeMobileMenu()"
      >
        <i class="fas fa-bed"></i>
        <span>Rooms</span>
      </a>
      <a
        routerLink="/staff"
        routerLinkActive="active"
        class="nav-item"
        (click)="closeMobileMenu()"
      >
        <i class="fas fa-users"></i>
        <span>Staff</span>
      </a>
      <a
        routerLink="/profile"
        routerLinkActive="active"
        class="nav-item"
        (click)="closeMobileMenu()"
      >
        <i class="fas fa-user"></i>
        <span>Profile</span>
      </a>
    </div>
  }

  <!-- Back to Top Button -->
  @if (showBackToTop) {
    <button class="back-to-top" (click)="scrollToTop()">
      <i class="fas fa-arrow-up"></i>
    </button>
  }
</div>
